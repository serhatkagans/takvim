services:
  takvim:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN ayarlayin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - takvim-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  takvim-data:
