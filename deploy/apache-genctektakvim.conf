# /genctektakvim: GencTek Etkinlik Takvimi -> 127.0.0.1:3030 (systemd: genctektakvim.service)
#
# SIRA ONEMLI: bu blok /genctekportal ve /genctek bloklarinin USTUNDE durmali.
# ProxyPass eslesmesi duz onek karsilastirmasidir; "ProxyPass /genctek" once
# gelseydi "/genctektakvim..." adresleri de genctek uygulamasina giderdi.
#
# Uygulama KOK YOLDA calisir ve oneki bilmez: onek burada soyulur, arayuz
# goreli adres kullanir. Uygulamadaki BASE_PATH yalnizca cerez yolunu
# /genctektakvim'e sinirlar (komsu uygulamalara oturum cerezi gitmesin).
#
# Oturum cerezi Secure: HTTP istekleri HTTPS'e tasinir.
# Ciplak /genctektakvim egik cizgili haline yonlendirilir; yoksa goreli
# adresler (app.js, api/...) koke cozulur. Ciplak ProxyPass satiri BILEREK
# YOK: varken yonlendirmeyi eziyordu (bkz. /genctekportal notu).
RewriteCond %{HTTPS} !=on
RewriteRule ^/genctektakvim(/.*)?$ https://%{HTTP_HOST}/genctektakvim$1 [R=301,L]
RedirectMatch 301 ^/genctektakvim$ /genctektakvim/
ProxyPass /genctektakvim/ http://127.0.0.1:3030/
ProxyPassReverse /genctektakvim/ http://127.0.0.1:3030/

